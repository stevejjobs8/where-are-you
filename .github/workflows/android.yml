name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        if: env.HAS_KS == 'true'
        run: echo "$KS_B64" | base64 -d > android/app/stable.keystore

      - name: Build debug APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 안드로이드 앱 최신 빌드
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
