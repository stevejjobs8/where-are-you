name: iOS SwiftUI Prototype

on:
  push:
    branches: [feature/ios-wkwebview]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile iOS Simulator app
        run: |
          xcodebuild -project ios/WhereAreYou.xcodeproj \
            -scheme WhereAreYou -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/WhereAreYouDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package Simulator app
        run: |
          mkdir -p ios/build-output
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/WhereAreYouDerived/Build/Products/Debug-iphonesimulator/WhereAreYou.app" \
            "ios/build-output/WhereAreYou-iOS-Simulator.zip"
      - name: Select an installed iPhone Simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          matches = [(runtime, dev) for runtime, group in data['devices'].items()
                     for dev in group if 'iOS' in runtime and dev['name'].startswith('iPhone')]
          if not matches:
              raise RuntimeError('No available iPhone Simulator runtime')
          runtime, device = matches[-1]
          print('Selected', runtime, device['name'], device['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('IOS_SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Boot Simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_ID"
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Run location policy unit tests
        run: |
          xcodebuild -project ios/WhereAreYou.xcodeproj \
            -scheme WhereAreYou -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/WhereAreYouDerived" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Capture running iPhone app
        run: |
          xcrun simctl install "$IOS_SIMULATOR_ID" \
            "$RUNNER_TEMP/WhereAreYouDerived/Build/Products/Debug-iphonesimulator/WhereAreYou.app"
          xcrun simctl launch "$IOS_SIMULATOR_ID" io.github.stevejjobs8.whereareyou.iospreview
          sleep 15
          xcrun simctl io "$IOS_SIMULATOR_ID" screenshot "ios/build-output/where-are-you-iphone-simulator.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: where-are-you-ios-simulator
          path: ios/build-output/*
          if-no-files-found: warn
