<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지금 너는 어디쯤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3EBF6; --ink:#2C3150; --ink-soft:#646B8E; --card:#FFFFFF; --line:#CFD8EA;
  --pink:#FF6F91; --pink-soft:#FFE0E8; --pink-ink:#B3264E; --focus:#5B6CFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2135; --ink:#EEF0FA; --ink-soft:#A4AACA; --card:#272F4D; --line:#3A4369;
    --pink:#FF7FA0; --pink-soft:#4A2840; --pink-ink:#FFC2D2; --focus:#9AA6FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2135; --ink:#EEF0FA; --ink-soft:#A4AACA; --card:#272F4D; --line:#3A4369;
  --pink:#FF7FA0; --pink-soft:#4A2840; --pink-ink:#FFC2D2; --focus:#9AA6FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 0;width:100%;max-width:1200px;margin:0 auto}
h1{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;font-size:clamp(22px,3vw,30px);margin:0}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--pink);display:inline-block}
@media (prefers-reduced-motion: no-preference){
  .live i{animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.bubble{position:absolute;left:0;top:0;background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:10px 16px 11px;text-align:center;width:max-content;max-width:min(78vw,300px);pointer-events:none;will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:15px;height:15px;background:var(--card);
  border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
#msg{font-family:'Jua','Gowun Dodum',sans-serif;font-size:18px;margin:0;line-height:1.3}
#sub{margin:3px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:var(--ink-soft);margin:0;pointer-events:none}
.linkbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 20px 14px;z-index:5}
.linkbox h2{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;font-size:21px;margin:0 0 6px}
.linkbox p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--ink-soft)}
.lrow{display:flex;gap:8px}
.lrow input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.lrow button{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--pink);color:#fff;cursor:pointer}
.lerr{color:var(--pink-ink)!important;min-height:1em;margin:8px 0 4px!important}
.lskip{font:inherit;font-size:13px;background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:4px 0}
.linkbox[hidden]{display:none}
.attr{position:absolute;right:10px;bottom:4px;margin:0;font-size:10.5px;color:var(--ink-soft);opacity:.85}
.attr a{color:inherit}
.views{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:6px}
.views button{font:inherit;font-size:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.views button:hover{border-color:var(--pink)}
.chip{position:absolute;left:14px;top:12px;font:inherit;font-size:14px;background:var(--card);color:var(--ink-soft);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--pink-ink);background:var(--pink-soft)}
/* 기본은 실서비스 화면(맵+말풍선만). 주소 끝에 ?dev 를 붙이면 개발용 조작판이 보임 */
body:not(.dev) .controls, body:not(.dev) #gps, body:not(.dev) .live{display:none}
body:not(.dev) .stage{padding-bottom:6px}
body.app .top{display:none}
#wx{margin:5px 0 0;font-size:13px;color:var(--pink-ink);line-height:1.35}
#wx[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:center;padding:8px 16px 18px}
.group{display:flex;align-items:center;gap:8px}
.lbl{font-size:14px;color:var(--ink-soft)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:4px;gap:2px}
.seg button,.sig{font:inherit;font-size:15px;border:0;cursor:pointer;border-radius:999px}
.seg button{background:transparent;color:var(--ink-soft);padding:8px 14px;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-checked="true"]{background:var(--pink-soft);color:var(--pink-ink)}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1.5px solid var(--line)}
.sig{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:10px 16px}
.sig:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:560px){
  .seg button{padding:7px 10px;font-size:14px}
  .top{padding:12px 16px 0}
  .lbl{display:none}
  .bubble{padding:6px 11px 7px;border-radius:14px;max-width:58vw}
  .bubble::after{width:11px;height:11px;bottom:-7px}
  #msg{font-size:13.5px}
  #sub{font-size:11.5px;margin-top:1px}
  #wx{font-size:11px;margin-top:2px}
  .sig{white-space:nowrap;padding:8px 13px;font-size:14px}
  .hint{display:none}
  .attr{left:0;right:0;text-align:center;font-size:10px}
}
</style>
</head>

<script>if(/[?&]dev\b/.test(location.search)) document.body.classList.add('dev'); if(/[?&]app\b/.test(location.search)) document.body.classList.add('app');</script>
<header class="top">
  <h1>지금 너는 어디쯤</h1>
  <span class="live"><i aria-hidden="true"></i>실시간 미리보기</span>
</header>

<section class="stage" id="stage">
  <canvas id="c" role="img" aria-label="상대방의 현재 위치를 보여주는 미니어처 3D 동네"></canvas>
  <div class="bubble" id="bubble" aria-live="polite"><p id="msg">불러오는 중</p><p id="sub"></p><p id="wx" hidden></p></div>
  <button class="chip" id="gps" aria-pressed="true">GPS 보정 켜짐</button>
  <div class="linkbox" id="linkbox" hidden>
    <h2>짝꿍 위치 보기</h2>
    <p>앱의 <b>더보기 → 웹으로 보기 연결</b>에서 받은 코드를 넣으면, 이 브라우저에서 짝꿍의 위치를 볼 수 있어요. 코드는 10분 동안 한 번만 쓸 수 있어요.</p>
    <div class="lrow"><input id="lcode" placeholder="예: AB12-CD34" autocapitalize="characters" aria-label="연결 코드"><button id="lgo">연결</button></div>
    <p class="lerr" id="lerr"></p>
    <button class="lskip" id="lskip">일단 미리보기만 볼게요</button>
  </div>
  <p class="hint">좌우로 끌면 회전, 위아래로 끌면 기울기</p>
  <p class="attr"><a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a> 데이터 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 기여자</a></p>
</section>

<nav class="controls" aria-label="미리보기 조작">
  <div class="group">
    <span class="lbl" id="l-mode">이동</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-mode" id="modes">
      <button role="radio" data-v="walk" aria-checked="false">걷기</button>
      <button role="radio" data-v="run" aria-checked="false">뛰기</button>
      <button role="radio" data-v="bike" aria-checked="false">자전거</button>
      <button role="radio" data-v="bus" aria-checked="true">버스</button>
      <button role="radio" data-v="subway" aria-checked="false">지하철</button>
      <button role="radio" data-v="rest" aria-checked="false">쉬는 중</button>
    </div>
    <button class="sig" id="sig">신호 바꾸기</button>
  </div>
  <div class="group">
    <span class="lbl" id="l-wx">날씨</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-wx" id="weathers">
      <button role="radio" data-v="clear" aria-checked="true">맑음</button>
      <button role="radio" data-v="rain" aria-checked="false">비</button>
      <button role="radio" data-v="wind" aria-checked="false">바람</button>
      <button role="radio" data-v="snow" aria-checked="false">눈</button>
    </div>
  </div>
  <div class="group">
    <span class="lbl" id="l-style">디자인</span>
    <div class="seg" role="radiogroup" aria-labelledby="l-style" id="styles"></div>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
fetch('hapjeong-1km.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(MAP){
/* ================= 디자인 테마 ================= */
const THEMES = {
  pastel:{label:'파스텔 장난감', swatch:'#FFC8DD',
    ground:'#A6DB8E', side:'#8CC77A', water:'#86CDF2', road:'#9C9EBB', line:'#FFFFFF', walk:'#EAE3F2',
    bridge:'#F4E7CF', accent:'#FF9EAE', blocks:['#FFD3B6','#FFF0A6','#C9F0C5','#C9CFFF','#FFC8DD','#BFE1FE','#EEDDFF'],
    houses:['#FFF4E0','#FFE2C2','#E8F4FF'], roofs:['#F2857D','#7FB3E8','#F4B860'], win:'#FFF8DF',
    trunk:'#9A6B45', greens:['#7CC97F','#5FB377','#9AD88A'], tree:'ball', lawn:'#C3EBA8',
    bus:'#4FC08D', glass:'#2F3B5C', train:'#6FD39A', soil:'#C99A6B', tunnel:'#3E4466',
    cloud:'#FFFFFF', cloudOp:1, bevel:.07, light:[.8,.8]},
  clay:{label:'말랑 점토', swatch:'#E8B49A',
    ground:'#C9D8A2', side:'#B58D68', water:'#9CCBD0', road:'#D8C6AE', line:'#F7EFE2', walk:'#EFE3D2',
    bridge:'#E9D3B4', accent:'#D98B6E', blocks:['#E8B49A','#EFD3A1','#B7CDA9','#C9B6D6','#E7BFBF','#A9C6D3'],
    houses:['#F3E3CF','#EAD2B8'], roofs:['#C46F57','#8DA7C4','#D9A15A'], win:'#FBF1DD',
    trunk:'#8C6646', greens:['#93B87A','#7FA86B','#A7C68B'], tree:'stack', lawn:'#D5E4B5',
    bus:'#E58F6A', glass:'#5A4A5E', train:'#93B87A', soil:'#B58D68', tunnel:'#6B5560',
    cloud:'#FFF9F0', cloudOp:1, bevel:.15, light:[.85,.7]},
  toy:{label:'블록 장난감', swatch:'#FFD400',
    ground:'#58B85C', side:'#3F8F44', water:'#3AA2EE', road:'#5A5F75', line:'#FFD400', walk:'#D9D9D9',
    bridge:'#F2F2F2', accent:'#E3342F', blocks:['#E3342F','#FFD400','#1E88E5','#F28C28','#F5F5F5','#43A047'],
    houses:['#F5F5F5','#FFD400'], roofs:['#E3342F','#1E88E5'], win:'#BFE6FF',
    trunk:'#7A4E2D', greens:['#2E9E44','#3CB54E','#238A3A'], tree:'cone', lawn:'#7FCB6E',
    bus:'#FFD400', glass:'#263046', train:'#1E88E5', soil:'#A0703F', tunnel:'#2B2F45',
    cloud:'#FFFFFF', cloudOp:1, bevel:.02, studs:true, light:[.75,.9]},
  spy:{label:'첩보 태블릿', swatch:'#5FF3FF',
    ground:'#15264A', side:'#0D1A35', water:'#1D4F86', road:'#22365F', line:'#5FF3FF', walk:'#1C3157',
    bridge:'#1C3360', accent:'#5FF3FF', blocks:['#1B3768','#1F4178','#243D70','#19335F'],
    houses:['#1F3E73'], roofs:['#2B5A9E'], win:'#7DF9FF', winGlow:true,
    trunk:'#2A4A7A', greens:['#2FD3B0','#27B89A'], tree:'cone', lawn:'#1A3557',
    bus:'#3EE0B5', glass:'#0D1A35', train:'#3EE0B5', soil:'#122444', tunnel:'#5FF3FF',
    cloud:'#9FD8FF', cloudOp:.3, bevel:.05, edges:'#5FF3FF', rings:true, grid:true, light:[.7,.6]}
};

/* ================= 지도 좌표·타일 =================
   원점: 합정역(OSM). 1 = 약 10m, +x 동쪽, +z 남쪽.
   건물·도로·물·녹지·버스정류장·역·출입구는 OpenFreeMap(OpenMapTiles, OSM) 벡터 타일에서 사람 주변만 받아옴.
   합정 1km 파일(MAP)은 타일에 없는 세부(신호등·횡단보도·출구 번호)와, 타일을 못 받을 때의 대체 지도로 씀. */
const LON0 = 126.9136561, LAT0 = 37.5493558, KX = 111320*Math.cos(LAT0*Math.PI/180)/10, KZ = 110540/10;
const toLocal = (lon,lat) => [(lon-LON0)*KX, -(lat-LAT0)*KZ];
const toLonLat = (x,z) => [LON0 + x/KX, LAT0 - z/KZ];
const R = 14, FL = .22;
const LINE2 = {color:'#5CC48A', name:'2'};
const mod = (a,n) => ((a%n)+n)%n;
const smooth = t => t<=0?0:t>=1?1:t*t*(3-2*t);
const rng = seed => { let a=seed|0; return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}; };
const lvH = l => FL*(l<=5 ? l : 5+(l-5)*.6);
const ROADW = {'양화로':1.4, '독막로':1.8};
const inBaked = (x,z) => Math.abs(x)<48 && Math.abs(z)<48;

/* 늘어나는 경로: 끝에 가까워지면 타일의 실제 길을 이어 붙임 */
class Path {
  constructor(pts, names, under, widths){ this.p=[]; this.n=[]; this.u=[]; this.w=[]; this.c=[0]; this.L=0;
    this.append(pts, names||[], under||[], widths||[]); }
  append(pts, names, under, widths){
    pts.forEach((q,i)=>{ const k=this.p.length;
      if(k){ const a=this.p[k-1], d=Math.hypot(q[0]-a[0], q[1]-a[1]); if(d<1e-3) return; this.c.push(this.c[k-1]+d); }
      this.p.push([q[0],q[1]]); this.n.push(names[i]||''); this.u.push(under[i]||0); this.w.push(widths[i]||1.2); });
    this.L=this.c[this.c.length-1]; }
  seg(s){ s=Math.max(0,Math.min(this.L,s)); let lo=0, hi=this.c.length-2;
    while(lo<hi){ const m=(lo+hi+1)>>1; if(this.c[m]<=s) lo=m; else hi=m-1; }
    const i=Math.max(0,lo), len=this.c[i+1]-this.c[i]||1e-6; return {i, t:(s-this.c[i])/len, len}; }
  at(s){ const {i,t,len}=this.seg(s), a=this.p[i], b=this.p[i+1]||a;
    return {x:a[0]+(b[0]-a[0])*t, z:a[1]+(b[1]-a[1])*t, hx:(b[0]-a[0])/len, hz:(b[1]-a[1])/len}; }
  nearest(x,z){ let best=1e9, bs=0;
    for(let i=0;i<this.p.length-1;i++){ const a=this.p[i], b=this.p[i+1], dx=b[0]-a[0], dz=b[1]-a[1], L2=dx*dx+dz*dz||1e-9;
      const t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/L2)), d=Math.hypot(x-a[0]-dx*t, z-a[1]-dz*t);
      if(d<best){ best=d; bs=this.c[i]+t*(this.c[i+1]-this.c[i]); } }
    return {s:bs, d:best}; }
  name(s){ const {i}=this.seg(s); return this.n[i+1]||this.n[i]||''; }
  depth(s){ const {i,t}=this.seg(s); const a=this.u[i]||0, b=this.u[i+1]!==undefined?this.u[i+1]:a; return a+(b-a)*t; }
  width(s){ const {i}=this.seg(s); return this.w[i]||1.2; }
}
const ROUTES = {
  bus: new Path(MAP.routes.bus.p, MAP.routes.bus.n, [], MAP.routes.bus.n.map(n=>ROADW[n]||1.4)),
  walk: new Path(MAP.routes.walk.p, MAP.routes.walk.n, [], MAP.routes.walk.n.map(n=>ROADW[n]||1.4)),
  subway: new Path(MAP.routes.subway.p, [], MAP.routes.subway.u)
};
const routeOf = m => m==='bus' ? ROUTES.bus : m==='subway' ? ROUTES.subway : ROUTES.walk;
const routeKind = m => m==='bus' ? 'bus' : m==='subway' ? 'subway' : 'walk';
const sigOn = path => MAP.signals.map(([x,z])=>path.nearest(x,z)).filter(q=>q.d<1.4).map(q=>q.s);
const SIGS = {bus:sigOn(ROUTES.bus), walk:sigOn(ROUTES.walk)};
let BUS_STOPS = [], STATIONS = [];
function laneOffset(m, path, s){
  const w = path.width(s);
  return m==='bus' ? Math.min(.35, w/2-.2) : m==='bike' ? w/2-.25 : m==='subway' ? 0 : w/2+.3;
}
function worldPos(m, s, dir){
  const path=routeOf(m), a=path.at(s), tx=a.hx*dir, tz=a.hz*dir, off=laneOffset(m,path,s);
  return {x:a.x - tz*off, z:a.z + tx*off, tx, tz};
}

/* ================= 벡터 타일(MVT) 읽기: 의존성 없는 작은 protobuf 해독기 ================= */
function parseMVT(ab){
  const buf=new Uint8Array(ab), dv=new DataView(ab), st={p:0}, layers={}, td=new TextDecoder();
  const vint=()=>{ let r=0, s=1, b; do{ b=buf[st.p++]; r+=(b&0x7f)*s; s*=128; }while(b>=0x80); return r; };
  const skip=w=>{ if(w===0) vint(); else if(w===1) st.p+=8; else if(w===2){ const l=vint(); st.p+=l; } else if(w===5) st.p+=4; };
  const str=()=>{ const l=vint(), s=td.decode(buf.subarray(st.p, st.p+l)); st.p+=l; return s; };
  const packed=()=>{ const l=vint(), end=st.p+l, out=[]; while(st.p<end) out.push(vint()); return out; };
  const msg=(end,cb)=>{ while(st.p<end){ const key=vint(); cb(Math.floor(key/8), key&7); } };
  msg(buf.length, (f,w)=>{
    if(f!==3 || w!==2){ skip(w); return; }
    const end=st.p+vint(), L={name:'', extent:4096, keys:[], values:[], feats:[]};
    msg(end, (f2,w2)=>{
      if(f2===1) L.name=str();
      else if(f2===2){ const e2=st.p+vint(), F={type:0, tags:[], geom:[]};
        msg(e2,(f3,w3)=>{ if(f3===2) F.tags=packed(); else if(f3===3) F.type=vint(); else if(f3===4) F.geom=packed(); else skip(w3); });
        L.feats.push(F); }
      else if(f2===3) L.keys.push(str());
      else if(f2===4){ const e2=st.p+vint(); let v=null;

function particles(n, kind){
  const geo = new THREE.BufferGeometry();
  const per = kind==='rain' ? 2 : 1, pos = new Float32Array(n*per*3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const seeds = [];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R; seeds.push({x:Math.cos(a)*r, z:Math.sin(a)*r, y:Math.random()*8, k:Math.random()}); }
  let obj;
  if(kind==='rain') obj = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:'#8EC3F5', transparent:true, opacity:.6}));
  else if(kind==='snow') obj = new THREE.Points(geo, new THREE.PointsMaterial({color:'#FFFFFF', size:.14, transparent:true, opacity:.95}));
  else { const col = new Float32Array(n*3); const cs=[new THREE.Color('#F2A33A'), new THREE.Color('#7CC97F'), new THREE.Color('#E8725A')];
    for(let i=0;i<n;i++){ const c=cs[i%3]; col.set([c.r,c.g,c.b], i*3); }
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));

  obj.userData = {seeds, kind}; obj.frustumCulled = false; obj.visible = false; world.add(obj); return obj;
}
function stepParticles(p, dt, t, wind){
  if(!p.visible) return;
  const s = p.userData.seeds, pos = p.geometry.attributes.position.array;
  for(let i=0;i<s.length;i++){
    const q = s[i];
    if(p.userData.kind==='rain'){ q.y -= 9*dt; q.x += wind*1.5*dt; }
    else if(p.userData.kind==='snow'){ q.y -= 1.1*dt; q.x += (Math.sin(t*1.3+q.k*9)*.4 + wind)*dt; }
    else { q.x += (4+q.k*2)*dt; q.y = .6+q.k*2.5+Math.sin(t*3+q.k*20)*.4; }
    if(q.y < 0 || q.x > R || q.x*q.x+q.z*q.z > R*R*1.05){
      const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R;
      q.x = p.userData.kind==='leaf' ? -R*Math.sqrt(Math.random()) : Math.cos(a)*r; q.z = Math.sin(a)*r;
      if(p.userData.kind==='leaf') q.z = (Math.random()*2-1)*Math.sqrt(Math.max(0,R*R-q.x*q.x));
      if(p.userData.kind!=='leaf') q.y = 6+Math.random()*2;
    }
    if(p.userData.kind==='rain'){ pos.set([q.x,q.y,q.z, q.x-wind*.06,q.y+.32,q.z], i*6); }
    else pos.set([q.x,q.y,q.z], i*3);
  }
  p.geometry.attributes.position.needsUpdate = true;
}

function drawSign(g, st){

  const cv = g.userData.cv, c = cv.getContext('2d');

  const tw = c.measureText(st.name).width, bw = 56*st.lines.length + tw + 52, x0 = (512-bw)/2;

  c.beginPath(); c.roundRect ? c.roundRect(x0,20,bw,88,44) : c.rect(x0,20,bw,88); c.fill(); c.stroke();
  st.lines.forEach(([n,col],k)=>{ c.fillStyle=col; c.beginPath(); c.arc(x0+44+k*56,64,24,0,Math.PI*2); c.fill();
    c.fillStyle='#FFFFFF'; c.font='bold 30px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(n, x0+44+k*56, 66); });

      for(const sg of (mode==='bus'?SIGS.bus:SIGS.walk)){ const line = sg - dir*(front+1.0);
        if(sigPhase!=='green' && (P.s-line)*dir <= .001 && (ns-line)*dir > 0){ ns=line; stopAt='red'; } }
    }
    const stopList = mode==='bus' ? BUS_STOPS.map(b=>b.s) : mode==='subway' ? STATIONS.map(x=>x.s) : [];
    if(stopAt!=='red') for(const stopS of stopList){ const key=stopS+':'+dir;
      if(served!==key && (P.s-stopS)*dir < 0 && (ns-stopS)*dir >= 0){ ns=stopS; hold = mode==='bus'?1.8:2.0; served=key; lastStop=stopS; break; } }
    if(dir>0 && ns > path.L-30 && t-lastExtend > .4){ lastExtend = t; extendPath(routeKind(mode)); }
    if(ns > path.L-1.5){ ns = path.L-1.5; dir = -1; served=null; }
    if(ns < 1.5){ ns = 1.5; dir = 1; served=null; }
    moved = ns-P.s; walked += Math.abs(moved); P.s = ns;
  }
  depthNow = mode==='subway' ? path.depth(P.s) : 0;
  gpsStep(dt, dt>0 ? moved/dt : 0, depthNow>.5);
  }

  /* 화면 중심 */
  const w = REALC && !(mode==='subway' && RT.sub) ? {x:RT.x, z:RT.z, tx:RT.tx, tz:RT.tz} : worldPos(mode, D.s, dir);
  if(REALC){ V.x += (w.x-V.x)*Math.min(1,dt*4); V.z += (w.z-V.z)*Math.min(1,dt*4); }
  else if(gpsOn || depthNow>.5 || !G.rawPos){ V.x += (w.x-V.x)*Math.min(1,dt*5); V.z += (w.z-V.z)*Math.min(1,dt*5); }
  else { V.x = G.rawPos.x; V.z = G.rawPos.z; }
  if(!lastDrawn || Math.abs(lastDrawn.x-V.x)>.004 || Math.abs(lastDrawn.z-V.z)>.004){ drawGround(V); lastDrawn={x:V.x,z:V.z}; }
  if(t-lastTiles > .5){ lastTiles = t; ensureTiles(V); }
  updateProps(V);

  const head = Math.atan2(w.tx, w.tz);
  bus.visible = mode==='bus'; bus.position.set(w.x-V.x, 0, w.z-V.z); bus.rotation.y = head;
  bike.visible = mode==='bike'; bike.position.set(w.x-V.x, 0, w.z-V.z); bike.rotation.y = head;
  bench.visible = mode==='rest'; bench.position.set(w.x-V.x, 0, w.z-V.z); bench.rotation.y = head + Math.PI/2;
  bikeWheels.forEach(wh=>wh.rotation.z -= (mode==='bike' && stopAt!=='red' && hold<=0 ? 2.0 : 0)*dt/.17);
  const dDisp = mode==='subway' ? path.depth(D.s) : 0;
  /* 각 칸: 경로 위 자기 자리(중심 ± 칸 간격)에서 위치·방향·기울기 계산 → 커브에서 칸이 꺾이고 경사에서 기울어짐 */
  train.position.set(0,0,0); train.rotation.set(0,0,0);
  if(mode==='subway') trainCars.forEach(car=>{
    const sk = D.s + dir*car.userData.off, a = path.at(sk);
    const yk = trainY(path.depth(sk)), ya = trainY(path.depth(sk+dir*.35)), yb = trainY(path.depth(sk-dir*.35));
    car.position.set(a.x-V.x, yk, a.z-V.z);
    car.rotation.set(-Math.atan2(ya-yb, .7), Math.atan2(a.hx*dir, a.hz*dir), 0);
  });
  if(under.visible || mode==='subway') updateNetwork(V);

  /* 인형 */
  const still = stopAt!=='' || speed===0;
  if(mode==='bus'){ seat(bus, -.15,.45-.24*.55,-.25,.55); doll.rotation.y=0; poseDoll(doll,'sit',t,weather); }
  else if(mode==='subway'){ seat(trainCars[2], -.1,-.24*.5,0,.5); doll.rotation.y=0; poseDoll(doll,'sit',t,weather); }
  else if(mode==='bike'){ seat(bike, 0,.47-.24*.8,-.12,.8); doll.rotation.y=0; poseDoll(doll, still?'idleBike':'bike', t, weather);
    if(still){ const ud=doll.userData; ud.legs[0].rotation.x=-1.0; ud.legs[1].rotation.x=.15; ud.arms[0].rotation.x=ud.arms[1].rotation.x=-1.25; ud.torso.rotation.x=.3; } }
  else if(mode==='rest'){ seat(world, w.x-V.x,.28-.24*.8,w.z-V.z,.8); doll.rotation.y = head - Math.PI/2; poseDoll(doll,'bench',t,weather); }
  else { seat(world, w.x-V.x,.02,w.z-V.z,.8); doll.rotation.y = head; poseDoll(doll, REALC && RT.still ? 'idle' : mode==='run'?'run':'walk', t, weather); }

  /* 말풍선 */
  let a,b,c='', top;
  const inside = mode==='bus' || mode==='subway', road = routeOf(mode).name(P.s) || '이 길';
  if(mode==='bus'){ top=.95; a='버스 타고 '+road+' 달리는 중';
    const ahead = BUS_STOPS.filter(b=>(b.s-P.s)*dir>0).sort((a,b)=>(a.s-P.s)*dir-(b.s-P.s)*dir)[0];
    const here = BUS_STOPS.find(b=>b.s===lastStop);
    b = stopAt==='red' ? '빨간불이라 잠깐 멈췄어요' : hold>0 && here ? here.name+' 정류장에 섰어요' : ahead ? '다음 정류장 '+ahead.name+' '+meters((ahead.s-P.s)*dir) : road+' 따라 가는 중이에요'; }
  else if(mode==='subway'){ top = .35; a='2호선 타고 이동 중';
    const nextSt = STATIONS.filter(x=>(x.s-P.s)*dir>0).sort((p,q)=>(p.s-P.s)*dir-(q.s-P.s)*dir)[0], hereSt = STATIONS.find(x=>x.s===lastStop);
    const xfer = st => st.lines && st.lines.length>1 ? ' ('+st.lines.slice(1).map(l=>l[0]+'호선').join(', ')+' 환승)' : '';
    b = hold>0 && hereSt ? hereSt.name+'역에 잠깐 정차했어요' : nextSt ? '다음 역 '+nextSt.name+' '+meters((nextSt.s-P.s)*dir)+xfer(nextSt)
      : depthNow<-.1 ? '고가 위를 달리는 중이에요' : depthNow<.5 ? '땅 위를 달리는 중이에요' : '다음 역으로 가는 중이에요'; }
  else if(mode==='bike'){ top=1.0; a='자전거 타는 중'; b = stopAt==='red' ? '신호 기다리는 중이에요' : road+' 따라 '+walkedText(walked)+' 달렸어요'; }
  else if(mode==='run'){ top=.8; a='하루는 지금 달리는 중'; b=road+' 따라 '+walkedText(walked)+' 뛰었어요'; }
  else if(mode==='walk'){ top=.8; a='하루는 지금 걷는 중'; b=road+' 따라 '+walkedText(walked)+' 걸었어요'; }
  else { top=.8; a='벤치에서 쉬는 중'; b=road+' 옆에서 12분째 쉬고 있어요'; }
  if(weather==='rain') c = inside ? '밖에는 비가 와요' : mode==='bike' ? '비 맞으면서 달리는 중이에요' : '비가 와서 우산 썼어요';
  else if(weather==='wind') c = inside ? '밖에 바람이 많이 불어요' : (mode==='walk'||mode==='run') ? '바람이 세서 몸을 숙이고 가요' : '바람에 머리가 날려요';
  else if(weather==='snow') c = inside ? '밖에는 눈이 와요' : '눈이 와서 목도리 했어요';
  if(!gpsOn && depthNow<=.5 && !REALC) c = (c?c+'. ':'') + '지금은 GPS 원본 그대로예요';
  if(REALC){
    const nm = roadNameNear(w.x, w.z), ago = RT.at ? Math.round((Date.now()-RT.at)/1000) : 0;
    const when = ago < 20 ? '방금 전' : ago < 120 ? ago+'초 전' : Math.round(ago/60)+'분 전';
    if(RT.err){ a='연결이 잠깐 끊겼어요'; b='다시 연결하는 중이에요'; }
    else if(RT.nopartner){ a='아직 짝꿍이 연결되지 않았어요'; b='앱에서 짝꿍 연결을 먼저 해주세요'; }
    else if(RT.off){ a=(RT.name ? RT.name+'의 ' : '')+'위치 공유가 꺼져 있어요'; b='상대방이 공유를 켜면 바로 보여요'; }
    else if(!RT.have){ a='위치를 기다리는 중이에요'; b='잠시만 기다려 주세요'; }
    else if(mode==='subway'){ a = who() + '지하철 타고 이동 중';
      const nx = STATIONS.filter(x=>(x.s-P.s)*dir>0).sort((p,q)=>(p.s-P.s)*dir-(q.s-P.s)*dir)[0];
      b = nx ? '다음 역 '+nx.name+'쯤 (땅속이라 위치는 추정이에요)' : '땅속이라 위치는 추정이에요'; }
    else { a = who() + (RT.still ? '잠깐 멈춰 있어요' : mode==='bus' ? '버스나 차 타고 이동 중' : mode==='bike' ? '자전거 타는 중' : mode==='run' ? '뛰는 중' : '걷는 중');
      b = (nm ? nm+' 근처, ' : '') + when + ' 위치예요'; }
    c = ago > 300 && RT.have && !RT.off ? '한동안 새 위치가 오지 않았어요' : '';
  }
  say(a,b,c);

  const cx = w.x-V.x, cz = w.z-V.z;
  const pinY = mode==='subway' ? Math.max(.35, trainY(dDisp)+.75) : top;
  pin.position.set(cx, pinY+.55+(reduce?0:Math.sin(t*3)*.08), cz); pin.quaternion.copy(camera.quaternion);
  ring.position.set(cx, mode==='subway' ? .02 : .02, cz);
  const rp=(t*.8)%1; ring.scale.setScalar(1+rp*2.2); ringMat.opacity=.75*(1-rp);
  gpsDots.forEach((m,k)=>{ const h=G.hist[k]; m.visible = !!h && depthNow<=.5 && h.age<6;
    if(m.visible){ m.position.set(h.x-V.x, .1, h.z-V.z); m.material.opacity = .65*(1-h.age/6); } });

  rain.visible = weather==='rain'; snow.visible = weather==='snow'; leaves.visible = weather==='wind';
  stepParticles(rain,dt,t,windAmt); stepParticles(snow,dt,t,windAmt); stepParticles(leaves,dt,t,windAmt);

  u += ((mode==='subway'?1:0)-u)*Math.min(1,dt*3.5);
  under.visible = u>.01;
  snowCover.visible = weather==='snow';

  clouds.forEach(cl=>{ const d=cl.userData; d.wx += dt*(.25+windAmt*1.2);
    cl.visible = !d.extra || weather==='rain' || weather==='snow';
    const wrap = v => mod(v+R*1.2, R*2.4)-R*1.2;
    cl.position.set(wrap(d.wx-V.x*.6), d.y, wrap(d.wz-V.z*.6)); });

  az += (azT-az)*Math.min(1,dt*4); el += (elT-el)*Math.min(1,dt*3);
  const xr = smooth(u)*smooth((dDisp-.15)/.7);
  const ty = -.2 - xr*1.3, Dd = dist*zoom;
  camera.position.set(Dd*Math.cos(el)*Math.sin(az), ty+Dd*Math.sin(el), Dd*Math.cos(el)*Math.cos(az));
  camera.up.set(0,1,0); camera.lookAt(0,ty,0);
  camera.updateMatrixWorld();

  { scene.updateMatrixWorld();
    const pr = renderer.getPixelRatio(), H = stage.clientHeight*pr, W = stage.clientWidth*pr;
    const toPx = v => { const q = v.clone().project(camera); return new THREE.Vector2((q.x*.5+.5)*W, (q.y*.5+.5)*H); };
    const a3 = trainCars[0].localToWorld(new THREE.Vector3(0,0,-.65)), b3 = trainCars[3].localToWorld(new THREE.Vector3(0,0,.65));
    const c3 = a3.clone().add(b3).multiplyScalar(.5);
    const depth = -c3.clone().applyMatrix4(camera.matrixWorldInverse).z;
    const ppu = H/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*depth);
    XR.uA.value.copy(toPx(a3)); XR.uB.value.copy(toPx(b3));
    XR.uR.value = ppu*1.35; XR.uD.value = depth+.3;
    XR.uTa.value.set(a3.x, a3.z); XR.uTb.value.set(b3.x, b3.z);
    XR.uS.value = xr;
    const near12 = ENTR.map(en=>({en, d:Math.hypot(en.wx-V.x, en.wz-V.z)})).sort((a,b)=>a.d-b.d).slice(0,12).map(o=>o.en);
    for(let i=0;i<12;i++){ const en=near12[i]; if(!en){ XR.hh.value[i].set(0,0); continue; }
      const rx=en.wx-V.x, rz=en.wz-V.z, k=smooth((R-.4-Math.hypot(rx,rz))/1.4);
      XR.hc.value[i].set(rx,rz); XR.ha.value[i].set(en.hx,en.hz); XR.hh.value[i].set(.3*k,.5*k); } }
  renderer.render(scene,camera);

  const p=pin.position.clone(); p.y+=.45; p.project(camera);
  const ww=stage.clientWidth, hh=stage.clientHeight, bw=bubble.offsetWidth, bh=bubble.offsetHeight;
  let sx=(p.x*.5+.5)*ww, sy=(-p.y*.5+.5)*hh-14;
  sx=Math.min(ww-bw/2-10,Math.max(bw/2+10,sx)); sy=Math.max(bh+10,sy);
  bubble.style.transform=`translate(${sx-bw/2}px, ${sy-bh}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}).catch(err=>{ console.error(err); const m=document.getElementById('msg'); if(m) m.textContent='지도 데이터를 불러오지 못했어요'; const sb=document.getElementById('sub'); if(sb) sb.textContent='hapjeong-1km.json 파일이 index.html과 같은 곳에 있는지 확인해 주세요'; });
</script>
