plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.stevejjobs8.whereareyou'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.stevejjobs8.whereareyou'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.4.2'
    }

    signingConfigs {
        stable {
            storeFile file('stable.keystore')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'whereareyou'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }
    buildTypes {
        debug {
            // 고정 서명 열쇠가 있으면 그걸로 서명 → 새 버전을 덮어쓰기 설치 가능
            if (file('stable.keystore').exists()) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
