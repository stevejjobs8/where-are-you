plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.stevejjobs8.whereareyou'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.stevejjobs8.whereareyou'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
