name: Android Design Preview APK

on:
  push:
    branches:
      - design/diorama-first-main-screen
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore optional stable signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        if: env.HAS_KS == 'true'
        run: echo "$KS_B64" | base64 -d > android/app/stable.keystore

      - name: Build design preview APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name preview APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk where-are-you-design-preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: where-are-you-design-preview
          path: where-are-you-design-preview.apk

      - name: Publish separate design preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-design-preview
          name: 어디쯤 안드로이드 디자인 미리보기
          prerelease: true
          target_commitish: design/diorama-first-main-screen
          files: where-are-you-design-preview.apk
